<form [formGroup]="resetForm" (ngSubmit)="ProceedChange()">
  <mat-card>
    <mat-card-header>
      <h1>Reset Password</h1>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field class="mat-50">
        <mat-label>Old Password</mat-label>
        <input formControlName="oldPassword" matInput />
      </mat-form-field>

      <mat-form-field class="mat-50">
        <mat-label>New Password</mat-label>
        <input formControlName="newPassword" matInput />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <div class="div-50">
        <button type="submit" mat-raised-button color="primary">
          Update Password
        </button>
      </div>

      <div class="div-50">
        <a
          class="mat-button"
          routerLink="/login"
          mat-raised-button
          color="accent"
        >
          Cancel</a
        >
      </div>
    </mat-card-actions>
  </mat-card>
</form>
