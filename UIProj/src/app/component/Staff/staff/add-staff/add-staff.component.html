<form [formGroup]="staffForm" (ngSubmit)="Save()">
  <mat-card>
    <div class="MatCard">
      <mat-card-content>
        <div
          style="
            display: flex;
            justify-content: space-between;
            padding-left: 1%;
            padding-right: 1%;
          "
        >
          <h1
            class="h4 text-gray-900 mb-4"
            style="display: flex; justify-content: start"
          >
            <b>{{ Title }}</b>
          </h1>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="35px"
            viewBox="0 -960 960 960"
            width="35px"
            fill="#5f6368"
          >
            <path
              d="M730-530H630q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h100v-100q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v100h100q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H790v100q0 12.75-8.68 21.37-8.67 8.63-21.5 8.63-12.82 0-21.32-8.63-8.5-8.62-8.5-21.37v-100Zm-370 49q-66 0-108-42t-42-108q0-66 42-108t108-42q66 0 108 42t42 108q0 66-42 108t-108 42ZM40-220v-34q0-35 17.5-63.5T108-360q75-33 133.34-46.5t118.5-13.5Q420-420 478-406.5T611-360q33 15 51 43t18 63v34q0 24.75-17.62 42.37Q644.75-160 620-160H100q-24.75 0-42.37-17.63Q40-195.25 40-220Zm60 0h520v-34q0-16-9-30.5T587-306q-71-33-120-43.5T360-360q-58 0-107.5 10.5T132-306q-15 7-23.5 21.5T100-254v34Zm260-321q39 0 64.5-25.5T450-631q0-39-25.5-64.5T360-721q-39 0-64.5 25.5T270-631q0 39 25.5 64.5T360-541Zm0-90Zm0 411Z"
            />
          </svg>
        </div>
        <mat-form-field class="mat-50">
          <mat-label>First Name</mat-label>
          <input formControlName="firstName" matInput />
        </mat-form-field>
        <mat-form-field class="mat-50">
          <mat-label>Last Name</mat-label>
          <input formControlName="lastName" matInput />
        </mat-form-field>

        <mat-form-field class="mat-50">
          <mat-label>Employee Address</mat-label>
          <input formControlName="address" matInput />
        </mat-form-field>

        <mat-form-field class="mat-50">
          <mat-label>Email</mat-label>
          <input formControlName="email" matInput />
        </mat-form-field>

        <mat-form-field class="mat-50">
          <mat-label>Phone No</mat-label>
          <input formControlName="phone" matInput />
        </mat-form-field>

        <mat-form-field class="mat-50">
          <mat-label>emiratesId</mat-label>
          <input formControlName="emiratesId" matInput />
        </mat-form-field>

        <mat-form-field class="mat-50">
          <mat-select
            formControlName="companyBranchId"
            (selectionChange)="BranchChange($event)"
          >
            @for(item of branchList; track item) {
            <mat-option value="{{ item.id }}">{{ item.branchName }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="div-50">
          <mat-checkbox formControlName="isActive">Is Active</mat-checkbox>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <div class="div-50">
          <button type="submit" mat-raised-button color="primary">Save</button>
        </div>

        <div class="div-50">
          <a
            class="mat-button"
            routerLink="/staff"
            mat-raised-button
            color="accent"
          >
            Cancel</a
          >
        </div>
      </mat-card-actions>
    </div>
  </mat-card>
</form>
