<mat-card class="company-list-card mb-4">
    <mat-card-header class="page-header d-flex flex-column align-items-center text-center">
        <h1 class="form-title mb-2">📂 Service List</h1>
        <p class="form-subtitle mb-3">
            View and manage all service categories and their sub categories.
        </p>
        <button mat-raised-button color="primary" class="add-button mb-4" (click)="openAddCategoryDialog()"
            style="min-width: 180px;">
            <mat-icon class="me-2">add</mat-icon>New Sub Service
        </button>
    </mat-card-header>

    <mat-card-content class="table-container mat-elevation-z2 px-3 py-4">

        <!-- Tabs Group -->
        <mat-tab-group [animationDuration]="'150ms'" class="custom-tab-group" mat-stretch-tabs="false"
            (selectedIndexChange)="onTabChange($event)">
            <mat-tab *ngFor="let category of categoryList" [label]="category.description">

                <div class="subcategory-container">
                    <mat-form-field appearance="outline">
                        <mat-label>🔍 Search</mat-label>
                        <input matInput [(ngModel)]="subcategorySearchTerm"
                            placeholder="Type subcategory name or description" />
                        <button *ngIf="subcategorySearchTerm" matSuffix mat-icon-button aria-label="Clear"
                            (click)="subcategorySearchTerm = ''">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                    <!-- Table -->
                    <div class="table-wrapper">
                        <table mat-table [dataSource]="getFilteredSubcategories(category.subcategories)"
                            class="mat-elevation-z2 custom-table">

                            <!-- Name -->
                            <ng-container matColumnDef="name">
                                <th mat-header-cell *matHeaderCellDef> Name </th>
                                <td mat-cell *matCellDef="let sub"> {{ sub.name }} </td>
                            </ng-container>

                            <!-- Description -->
                            <ng-container matColumnDef="description">
                                <th mat-header-cell *matHeaderCellDef> Description </th>
                                <td mat-cell *matCellDef="let sub"> {{ sub.description }} </td>
                            </ng-container>

                            <!-- Min 
                            <ng-container matColumnDef="minValue">
                                <th mat-header-cell *matHeaderCellDef> Min Value </th>
                                <td mat-cell *matCellDef="let sub"> {{ sub.minValue }} </td>
                            </ng-container>-->


                            <!-- Max 
                            <ng-container matColumnDef="maxValue">
                                <th mat-header-cell *matHeaderCellDef> Miax Value </th>
                                <td mat-cell *matCellDef="let sub"> {{ sub.maxValue }} </td>
                            </ng-container>-->

                            <!-- Status -->
                            <ng-container matColumnDef="status">
                                <th mat-header-cell *matHeaderCellDef> Status </th>
                                <td mat-cell *matCellDef="let sub" [class.inactive]="!sub.isActive">
                                    {{ sub.isActive ? 'Active' : 'Inactive' }}
                                </td>
                            </ng-container>

                            <!-- Actions -->
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef> Actions </th>
                                <td mat-cell *matCellDef="let sub">
                                    <div class="action-buttons">
                                        <button *ngIf="!sub.isDefaultCategory" mat-icon-button color="primary"
                                            matTooltip="Edit" (click)="openEditCategoryDialog(sub)">
                                            <mat-icon>edit</mat-icon>
                                        </button>

                                        <button *ngIf="!sub.isDefaultCategory" mat-icon-button color="warn"
                                            matTooltip="Delete" (click)="deleteSubcategory(sub.id)">
                                            <mat-icon>delete</mat-icon>
                                        </button>
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="subcategoryColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: subcategoryColumns"></tr>
                        </table>
                    </div>

                    <!-- No Subcategories Fallback -->
                    <ng-template #noSubcategories>
                        <div class="empty-state">
                            <mat-icon class="empty-icon">info</mat-icon>
                            <p>No subcategories found for this category.</p>
                        </div>
                    </ng-template>
                </div>
            </mat-tab>
        </mat-tab-group>

    </mat-card-content>
</mat-card>
